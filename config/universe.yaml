# Tradable universe (SPEC 6, SPEC 1.6).
#
# An order for a ticker that is not in `instruments` below is rejected by the
# validator, logged with a reason, and never reaches the ledger. Nothing else
# in this file is tradable: `references` and `fx` exist so the brief can quote
# context, and an order against one of them is as invalid as an order against
# a ticker that is not here at all.
#
# Sized at ~150 names on purpose. Fetching 1,100 symbols daily gets the client
# throttled and buys nothing.
#
# EXPANSION: add entries, never renumber or restructure. Consumers key off
# `ticker`. `schemaVersion` changes only if a field changes meaning, and any
# such change needs a migration note here.
schemaVersion: 1

# Currency scope. SPEC 4 defines exactly two: EUR portfolios, USD positions
# converted at EURUSD=X. Every EU name below is therefore EUR-denominated —
# no CHF, GBP, DKK, SEK or NOK listings — and every US name is USD. Admitting
# a third currency means a second FX pair and an FX attribution that SPEC 4
# does not describe, so it waits for a decision rather than sneaking in.
currencies: [EUR, USD]

markets:
  XETR: { name: Xetra,               country: DE, currency: EUR, timezone: Europe/Berlin }
  XPAR: { name: Euronext Paris,      country: FR, currency: EUR, timezone: Europe/Paris }
  XAMS: { name: Euronext Amsterdam,  country: NL, currency: EUR, timezone: Europe/Amsterdam }
  XMAD: { name: Bolsa de Madrid,     country: ES, currency: EUR, timezone: Europe/Madrid }
  XMIL: { name: Borsa Italiana,      country: IT, currency: EUR, timezone: Europe/Rome }
  XBRU: { name: Euronext Brussels,   country: BE, currency: EUR, timezone: Europe/Brussels }
  XLIS: { name: Euronext Lisbon,     country: PT, currency: EUR, timezone: Europe/Lisbon }
  XWBO: { name: Wiener Borse,        country: AT, currency: EUR, timezone: Europe/Vienna }
  XHEL: { name: Nasdaq Helsinki,     country: FI, currency: EUR, timezone: Europe/Helsinki }
  XNAS: { name: Nasdaq,              country: US, currency: USD, timezone: America/New_York }
  XNYS: { name: NYSE,                country: US, currency: USD, timezone: America/New_York }

# Benchmarks for SPEC 10's excess-return evaluation: a closed position is
# judged against its region/sector peer over the identical window, never
# against zero. Keyed (region, sector) so instruments carry no duplication.
benchmarks:
  default: { EU: MEUD.PA, US: VUSA.AS, GLOBAL: IWDA.AS }
  sector:
    technology:  { EU: MEUD.PA, US: XDWT.DE }
    financials:  { EU: MEUD.PA, US: VUSA.AS }
    healthcare:  { EU: MEUD.PA, US: VUSA.AS }
    energy:      { EU: MEUD.PA, US: VUSA.AS }
    industrials: { EU: MEUD.PA, US: VUSA.AS }
    consumer:    { EU: MEUD.PA, US: VUSA.AS }
    materials:   { EU: MEUD.PA, US: VUSA.AS }
    utilities:   { EU: MEUD.PA, US: VUSA.AS }
    telecom:     { EU: MEUD.PA, US: VUSA.AS }
    realestate:  { EU: IPRP.AS, US: VUSA.AS }

# The ETF the `dca` control buys every month with the whole contribution.
dcaInstrument: IWDA.AS

